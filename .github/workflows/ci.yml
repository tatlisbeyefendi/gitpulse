name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest --cov --cov-report=term-missing

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  package:
    name: build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/gitpulse --version
      - name: Scan a throw-away workspace with real repositories
        run: |
          mkdir -p /tmp/ws/{alpha,beta}
          for repo in alpha beta; do
            cd /tmp/ws/$repo
            git init -q -b main
            git -c user.email=ci@example.com -c user.name=CI commit -q --allow-empty -m "init"
          done
          echo dirty > /tmp/ws/alpha/file.txt
          /tmp/smoke/bin/gitpulse /tmp/ws --json > /tmp/report.json
          python -c "import json; r = json.load(open('/tmp/report.json')); assert r['totals']['repos'] == 2, r; assert r['totals']['dirty'] == 1, r; print('smoke scan ok:', r['totals'])"
          /tmp/smoke/bin/gitpulse /tmp/ws --fail-on dirty && exit 1 || echo "fail-on dirty works"
